<tui-root
  [attr.tuiTheme]="darkMode() ? 'dark' : 'light'"
  [class.dark]="darkMode()"
  [class.light]="!darkMode()"
>
<div class="app-shell">
  <app-header />
  <div class="app-body">
    <app-sidebar />
    <main class="app-content">
      <!-- A light of the accents that comes in with osu!'s music. -->
      <div class="music-glow" appMusicPulse="glow" aria-hidden="true"></div>
      @if (osuPath.missing()) {
        <app-osu-path />
      }
      <div class="page-outlet">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

<app-toasts />
</tui-root>
