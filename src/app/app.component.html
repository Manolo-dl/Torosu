<tui-root
  [attr.tuiTheme]="darkMode() ? 'dark' : 'light'"
  [class.dark]="darkMode()"
  [class.light]="!darkMode()"
>
  <app-window-controls />
<div class="app-shell">
  <app-header />
  <div class="app-body">
    <app-sidebar />
    <main class="app-content">
      <app-osu-path />
      <div class="page-outlet">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
<app-toast />

</tui-root>
