<label
  class="zone"
  appTxtFileDrop
  #dropzone="appTxtFileDrop"
  [class.drag-over]="dropzone.isDragOver()"
  (fileContent)="fileContent.emit($event)"
>
  <input type="file" accept=".txt,text/plain" class="file" (change)="onPick($event)" />
  <span class="icon"><app-icon [name]="dropzone.isDragOver() ? 'file-down' : 'file-text'" /></span>
  @if (dropzone.isDragOver()) {
    <span class="title" [innerHTML]="'dropzone.dropHere' | transloco"></span>
  } @else {
    <span class="title"><span [innerHTML]="'dropzone.dropOr' | transloco"></span>&ngsp;<span class="browse">{{ 'dropzone.browse' | transloco }}</span></span>
  }
</label>
