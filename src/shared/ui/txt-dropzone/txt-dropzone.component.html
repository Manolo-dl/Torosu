<label
  appTxtFileDrop
  #dropzone="appTxtFileDrop"
  tuiInputFiles
  [class.drag-over]="dropzone.isDragOver()"
  (fileContent)="fileContent.emit($event)"
>
  <input
    accept=".txt"
    tuiInputFiles
    [ngModel]="null"
    (ngModelChange)="onFileSelect($event)"
  />
  <ng-template let-dragged>
    <div class="content">
      <tui-icon icon="@tui.file-text" />
      @if (dragged || dropzone.isDragOver()) {
        <span [innerHTML]="'dropzone.dropHere' | transloco"></span>
      } @else {
        <span><span [innerHTML]="'dropzone.dropOr' | transloco"></span> <a tuiLink>{{ 'dropzone.browse' | transloco }}</a></span>
      }
    </div>
  </ng-template>
</label>
