<header>
  @if (icon(); as icon) {
    <span class="icon" aria-hidden="true"><app-icon [name]="icon" /></span>
  }
  <div class="titles">
    <h1>{{ heading() }}</h1>
    @if (subtitle(); as subtitle) {
      <p>{{ subtitle }}</p>
    }
  </div>
  <div class="end">
    <ng-content />
  </div>
</header>
