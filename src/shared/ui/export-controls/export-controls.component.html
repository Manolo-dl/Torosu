<app-option-group
  size="s"
  stretch
  [options]="options"
  [active]="selectedIndex()"
  (activeChange)="selectedIndex.set($event)"
/>

<button
  appButton="primary"
  icon="@tui.download"
  size="m"
  type="button"
  [disabled]="disabled || count === 0"
  (click)="export()"
>
  {{ 'export.button' | transloco: { count } }}
</button>
