<tui-segmented
  size="s"
  [activeItemIndex]="selectedIndex()"
  (activeItemIndexChange)="selectedIndex.set($event)"
>
  @for (fmt of formats; track fmt.value) {
    <button type="button">{{ fmt.label | transloco }}</button>
  }
</tui-segmented>

<button
  iconStart="@tui.download"
  size="m"
  tuiButton
  type="button"
  [disabled]="disabled || count === 0"
  (click)="export()"
>
  {{ 'export.button' | transloco: { count } }}
</button>
