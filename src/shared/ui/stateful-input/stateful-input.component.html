@if (!hidden()) {
    <tui-textfield [invalid]="invalid() && touched()">
        @if (label()) {
            <label tuiLabel [for]="id()">{{ label() }}</label>
        }
        <input
            tuiInput
            [id]="id()"
            [type]="type()"
            [placeholder]="placeholder()"
            [value]="value()"
            [disabled]="disabled()"
            [readonly]="readonly()"
            (input)="value.set($any($event.target).value)"
            (blur)="touched.set(true)"
        />
    </tui-textfield>

    @if (invalid() && touched()) {
        @for (error of errors(); track error) {
            <tui-error [error]="error.message ?? null" />
        }
    }
}
