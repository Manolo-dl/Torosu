<app-page-header heading="Trainer" subtitle="Fine-tune difficulty stats and chain modifiers before generating a new map." />

<app-trainer-beatmap-header />

<div class="layout">
  <aside class="sidebar">
    <app-trainer-difficulty-sliders />
    <app-trainer-presets />
    <app-trainer-actions />
  </aside>

  <section class="converts">
    @for (convert of trainer.converts(); track convert.id; let i = $index) {
      <app-trainer-task-pipeline [convert]="convert" [number]="i + 1" />
    }
    <button
      appearance="secondary"
      iconStart="@tui.plus"
      size="m"
      tuiButton
      type="button"
      (click)="trainer.addConvert()"
    >
      Add convert
    </button>
  </section>
</div>
