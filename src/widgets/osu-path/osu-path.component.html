<div appNotice="warning">
    <p class="notice-title">{{ 'osuPath.notFound' | transloco }}</p>
    <p [innerHTML]="'osuPath.needed' | transloco"></p>
    <div class="notice-actions">
        <button
            appButton="primary"
            size="s"
            type="button"
            icon="folder-open"
            [disabled]="osuPath.isLoading()"
            (click)="osuPath.selectManually()"
        >
            {{ 'osuPath.select' | transloco }}
        </button>
        <button
            appButton="secondary"
            size="s"
            type="button"
            icon="scan-search"
            [loading]="osuPath.isLoading()"
            (click)="osuPath.retry()"
        >
            {{ 'osuPath.detect' | transloco }}
        </button>
    </div>
</div>
