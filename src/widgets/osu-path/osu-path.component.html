<div appearance="warning" size="m" tuiNotification>
    <div tuiTitle>
        {{ 'osuPath.notFound' | transloco }}
        <span tuiSubtitle [innerHTML]="'osuPath.needed' | transloco"></span>
    </div>
    <div class="actions">
        <button
            size="s"
            tuiButton
            type="button"
            [disabled]="osuPath.isLoading()"
            (click)="osuPath.selectManually()"
        >
            {{ 'osuPath.select' | transloco }}
        </button>
        <button
            appearance="secondary"
            size="s"
            tuiButton
            type="button"
            [loading]="osuPath.isLoading()"
            (click)="osuPath.retry()"
        >
            {{ 'osuPath.detect' | transloco }}
        </button>
    </div>
</div>
