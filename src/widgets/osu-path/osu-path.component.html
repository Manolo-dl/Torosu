<div appearance="warning" size="m" tuiNotification>
    <div tuiTitle>
        osu! folder not found
        <span tuiSubtitle>
            Every tool needs it. Select the folder that has <strong>osu!.db</strong>, or open osu! and detect it again.
        </span>
    </div>
    <div class="actions">
        <button
            size="s"
            tuiButton
            type="button"
            [disabled]="osuPath.isLoading()"
            (click)="osuPath.selectManually()"
        >
            Select folder
        </button>
        <button
            appearance="secondary"
            size="s"
            tuiButton
            type="button"
            [loading]="osuPath.isLoading()"
            (click)="osuPath.retry()"
        >
            Detect
        </button>
    </div>
</div>
