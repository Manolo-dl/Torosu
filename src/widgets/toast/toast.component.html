<div class="toast-container">
  @for (toast of store.toasts(); track toast.id) {
    <div class="toast" [ngClass]="toast.type">
      <!--<ng-icon class="toast-icon" [name]="toastIcon[toast.type]" size="18" />-->
      <span class="toast-message">{{ toast.message }}</span>
      <button class="toast-close" (click)="store.dismiss(toast.id)">
        <!--<ng-icon name="phosphorX" size="14" />-->
      </button>
    </div>
  }
</div>
