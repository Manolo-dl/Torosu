<div class="window-controls" data-tauri-drag-region>
  @for (control of controls; track $index) {
      <button
        size="m"
        appearance="flat"
        tuiIconButton
        type="button"
        [iconStart]="control.icon"
        (click)="control.action()"

        tabIndex="0"
      >
        {{ control.label }}
      </button>
  }
</div>
