<div class="window-controls">
  @for (control of controls; track control.label) {
    <button
      appButton="ghost"
      size="s"
      type="button"
      iconOnly
      [icon]="control.icon"
      [class.close]="control.label === 'window.close'"
      (click)="control.action()"
    >
      {{ control.label | transloco }}
    </button>
  }
</div>
