<header>
  <!-- Left -->
  <div>
    <h1>Torosu</h1>
  </div>

  <!-- Right -->
  <div class="actions">
    <button
      size="m"
      appearance="flat"
      tuiButton
      type="button"
      (click)="darkMode.update(dark => !dark)"
    >
      <fa-icon [icon]="icon()" />
    </button>

    <button
      size="m"
      appearance="flat"
      tuiButton
      type="button"
      (click)="navStore.toggleMode()"
    >
      {{ navStore.isDevMode() }}
    </button>

    <app-config-drawer />
  </div>
</header>
