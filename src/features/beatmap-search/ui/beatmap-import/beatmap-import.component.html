<label
  tuiInputFiles
  [class.drag-over]="isDragOver()"
>
  <input
    accept=".txt"
    tuiInputFiles
    [ngModel]="null"
    (ngModelChange)="onFileSelect($event)"
  />
  <ng-template let-dragged>
    <div class="content">
      <tui-icon icon="@tui.file-text" />
      @if (dragged || isDragOver()) {
        <span>Drop the <code>.txt</code> file here</span>
      } @else {
        <span>Drop a <code>.txt</code> file here or <a tuiLink>browse</a></span>
      }
    </div>
  </ng-template>
</label>
