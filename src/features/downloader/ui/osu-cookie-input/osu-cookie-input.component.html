<div
  size="m"
  tuiNotification
  [appearance]="userStore.user()?.osuSession ? 'info' : 'warning'"
>
  <div tuiTitle>
    <span>
      {{ 'downloader.session' | transloco }}
      @if (userStore.user()?.osuSession) {
        <span appearance="positive" size="s" tuiBadge>{{ 'downloader.cookie.active' | transloco }}</span>
      } @else {
        <span appearance="warning" size="s" tuiBadge>{{ 'downloader.cookie.none' | transloco }}</span>
      }
    </span>
    <div tuiSubtitle>
      <span [innerHTML]="'downloader.cookie.required' | transloco"></span>
      <span
        [innerHTML]="(config.config()?.downloader?.save_session ? 'downloader.cookie.saved' : 'downloader.cookie.sessionOnly') | transloco"
      ></span>
    </div>
  </div>
</div>

<form [formRoot]="osuCookieForm">
  <app-stateful-input
    label="downloader.cookie.label"
    [id]="'osuCookie'"
    [formField]="osuCookieForm.osuSession"
    placeholder="downloader.cookie.placeholder" />

  <div class="button-group">
    <button size="m" tuiButton type="submit">{{ 'downloader.cookie.use' | transloco }}</button>
    @if (userStore.user()?.osuSession) {
      <button
        appearance="negative"
        size="m"
        tuiButton
        type="button"
        (click)="clearSession()"
      >
        {{ 'downloader.cookie.clear' | transloco }}
      </button>
    }
  </div>
</form>
