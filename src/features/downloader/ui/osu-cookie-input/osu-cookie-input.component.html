<div [appNotice]="userStore.user()?.osuSession ? 'success' : 'warning'">
  <p class="notice-title">
    {{ 'downloader.session' | transloco }}
    @if (userStore.user()?.osuSession) {
      <span appBadge tone="success" size="s" dot>{{ 'downloader.cookie.active' | transloco }}</span>
    } @else {
      <span appBadge tone="warning" size="s">{{ 'downloader.cookie.none' | transloco }}</span>
    }
  </p>
  <p>
    <span [innerHTML]="'downloader.cookie.required' | transloco"></span>
    &ngsp;
    <span
      [innerHTML]="(config.config()?.downloader?.save_session ? 'downloader.cookie.saved' : 'downloader.cookie.sessionOnly') | transloco"
    ></span>
  </p>
</div>

<form [formRoot]="osuCookieForm">
  <app-stateful-input
    label="downloader.cookie.label"
    [id]="'osuCookie'"
    [formField]="osuCookieForm.osuSession"
    placeholder="downloader.cookie.placeholder" />

  <div class="button-group">
    <button appButton="primary" size="m" type="submit" icon="key-round">{{ 'downloader.cookie.use' | transloco }}</button>
    @if (userStore.user()?.osuSession) {
      <button
        appButton="danger"
        size="m"
        type="button"
        (click)="clearSession()"
      >
        {{ 'downloader.cookie.clear' | transloco }}
      </button>
    }
  </div>
</form>
