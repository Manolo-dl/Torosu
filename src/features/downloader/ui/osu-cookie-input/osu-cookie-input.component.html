<div
  size="m"
  tuiNotification
  [appearance]="userStore.user()?.osuSession ? 'info' : 'warning'"
>
  <div tuiTitle>
    <span>
      Osu session
      @if (userStore.user()?.osuSession) {
        <span appearance="positive" size="s" tuiBadge>Cookie active</span>
      } @else {
        <span appearance="warning" size="s" tuiBadge>No cookie set</span>
      }
    </span>
    <div tuiSubtitle>
      The <strong>osu_session</strong> cookie is required to download beatmaps.
    </div>
  </div>
</div>

<form [formRoot]="osuCookieForm">
  <app-stateful-input
    [label]="'Osu Session Cookie'"
    [id]="'osuCookie'"
    [formField]="osuCookieForm.osuSession"
    [placeholder]="'Enter your osu_session cookie'" />

  <div class="button-group">
    <button size="m" tuiButton type="submit">Save cookie</button>
    @if (userStore.user()?.osuSession) {
      <button
        appearance="negative"
        size="m"
        tuiButton
        type="button"
        (click)="clearSession()"
      >
        Clear cookie
      </button>
    }
  </div>
</form>
