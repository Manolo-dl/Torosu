@switch (store.status().state) {
  @case ('connected') {
    <span appBadge tone="success" size="l" class="connected" dot>
      {{ 'osuReader.badge.connected' | transloco }}
    </span>
  }
  @case ('waiting') {
    <span appBadge tone="neutral" size="l" dot>
      {{ 'osuReader.badge.waiting' | transloco }}
    </span>
  }
  @case ('error') {
    <span appBadge tone="danger" size="l" dot>
      {{ 'osuReader.badge.error' | transloco }}
    </span>
  }
}
