@if (store.data()) {
  <div appCard>
    <app-accordion size="s" [closeOthers]="false">
      @for (section of sections(); track section[0]) {
        <app-accordion-item>
          <span appAccordionHeading class="section">
            <span class="name">{{ section[0] }}</span>
            <span appBadge tone="neutral" size="s">{{ typeLabel(section[1]) }}</span>
          </span>
          <!-- Made only while open, so big sections cost nothing while closed -->
          <ng-template appAccordionContent>
            <app-osu-field-tree [value]="section[1]" />
          </ng-template>
        </app-accordion-item>
      }
    </app-accordion>
  </div>
} @else {
  <div appCard>
    <p class="empty">{{ 'dev.osuData.empty' | transloco }}</p>
  </div>
}
