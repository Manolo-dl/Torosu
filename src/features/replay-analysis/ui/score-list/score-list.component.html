<div appCard class="card">
  <label class="follow">
    <span class="follow-text">
      {{ 'replays.follow' | transloco }}
      <span class="hint">{{ 'replays.followHint' | transloco }}</span>
    </span>
    <input size="s" appSwitch type="checkbox" [checked]="store.settings().follow" (change)="follow($event)" />
  </label>

  <tui-textfield iconStart="@tui.search" tuiTextfieldSize="s">
    <input
      [placeholder]="'replays.search' | transloco"
      tuiInput
      type="search"
      [value]="store.search()"
      (input)="search($event)"
    />
  </tui-textfield>

  @if (store.keyCounts().length > 1) {
    <app-option-group [options]="keyOptions()" [active]="keyIndex()" (activeChange)="pickKeys($event)" />
  }

  @if (loading()) {
    <div class="skeletons" aria-busy="true">
      @for (row of [0, 1, 2, 3, 4, 5]; track row) {
        <div class="skeleton-score" [style.--skeleton-delay]="row * 0.08 + 's'">
          <span class="titles">
            <app-skeleton [width]="row % 2 === 0 ? '75%' : '60%'" height="0.8rem" />
            <app-skeleton [width]="row % 3 === 0 ? '45%' : '35%'" height="0.65rem" />
            <app-skeleton width="30%" height="0.55rem" />
          </span>
          <span class="side">
            <app-skeleton width="3rem" height="0.8rem" />
            <app-skeleton width="2.25rem" height="1rem" radius="pill" />
          </span>
        </div>
      }
    </div>
  } @else if (store.filtered().length === 0) {
    <div class="empty">{{ (store.entries().length ? 'replays.noMatch' : 'replays.none') | transloco }}</div>
  } @else {
    <cdk-virtual-scroll-viewport itemSize="64" tuiScrollRef class="viewport">
      <tui-scroll-controls />
      <div *cdkVirtualFor="let entry of store.filtered(); trackBy: trackEntry" class="item">
        <button
          type="button"
          class="score"
          [class.selected]="entry.score.replay === store.selected()"
          [disabled]="!entry.map"
          [title]="entry.map ? '' : ('replays.mapMissing' | transloco)"
          (click)="store.select(entry)"
        >
          <span class="titles">
            <span class="title">{{ entry.map?.title ?? ('replays.unknownMap' | transloco) }}</span>
            <span class="diff">{{ entry.map?.diffName ?? entry.score.beatmapMd5 }}</span>
            <span class="date">{{ date(entry.score.timestamp) }}</span>
          </span>
          <span class="side">
            <span class="accuracy">{{ entry.accuracy | number: '1.2-2' }}%</span>
            <span class="badges">
              @if (entry.map) {
                <span appBadge tone="neutral" size="s">{{ entry.map.keys }}K</span>
              }
              @for (mod of entry.mods; track mod) {
                <span appBadge tone="info" size="s">{{ mod }}</span>
              }
            </span>
          </span>
        </button>
      </div>
    </cdk-virtual-scroll-viewport>
  }
</div>
