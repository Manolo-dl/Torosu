@if (store.connected()) {
  <span appearance="positive" size="l" tuiBadge tuiStatus="var(--tui-status-positive)" class="connected">
    Connected
  </span>
} @else {
  <span appearance="neutral" size="l" tuiBadge tuiStatus="var(--tui-text-tertiary)">
    Disconnected
  </span>
  <button
    appearance="secondary"
    iconStart="@tui.refresh-cw"
    size="s"
    tuiButton
    type="button"
    (click)="reconnect()"
  >
    Reconnect
  </button>
}
