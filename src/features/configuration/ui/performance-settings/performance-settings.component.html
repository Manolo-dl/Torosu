<section>
  <h3 appSectionTitle>{{ 'settings.performance.effects' | transloco }}</h3>

  <label tuiCell>
    <span tuiTitle>
      {{ 'settings.performance.backgrounds' | transloco }}
      <span tuiSubtitle>{{ 'settings.performance.backgroundsHint' | transloco }}</span>
    </span>
    <input appSwitch type="checkbox" [checked]="appearance.effects()" (change)="appearance.setEffects(checked($event))" />
  </label>

  <div class="row">
    <span tuiTitle>
      {{ 'settings.performance.quality' | transloco }}
      <span tuiSubtitle>{{ 'settings.performance.qualityHint' | transloco }}</span>
    </span>
    <app-option-group
      size="s"
      [options]="qualities"
      [active]="qualityIndex()"
      (activeChange)="setQuality($event)"
    />
  </div>
</section>
