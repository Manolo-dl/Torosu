<tui-textfield>
  <label tuiLabel>{{ 'settings.nameFormat.label' | transloco }}</label>
  <input
    tuiInput
    [ngModel]="format()"
    (ngModelChange)="format.set($event)"
  />
</tui-textfield>

<div class="formats">
  @for (preset of presets(); track preset.label) {
    <button
      appearance="secondary"
      size="xs"
      tuiButton
      type="button"
      (click)="format.set(preset.format)"
    >
      {{ preset.label | transloco }}
    </button>
  }
</div>

@if (example()) {
  <p class="example">{{ 'settings.nameFormat.example' | transloco }} <strong>{{ example() }}</strong></p>
}

<ul class="fields">
  @for (item of fields(); track item.field) {
    <li><code>{{ item.field }}</code> {{ item.meaning | transloco }}</li>
  }
</ul>

<p class="hint">
  {{ 'settings.nameFormat.hint' | transloco }}
</p>
