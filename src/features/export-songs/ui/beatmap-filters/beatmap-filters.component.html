<div appearance="floating" tuiCardLarge="compact">
  <header>
    <h3 tuiTitle>Filters</h3>
    <button
      appearance="flat"
      iconStart="@tui.rotate-ccw"
      size="xs"
      tuiButton
      type="button"
      (click)="reset()"
    >
      Reset
    </button>
  </header>

  <div class="modes">
  @for (m of modeConfigs; track m.value) {
    <section
      class="mode"
      [class.excluded]="isModeExcluded(m.value)"
      [style.--mode-color]="m.color"
    >
      <div class="mode-header" (click)="toggleExpand(m.value)">
        <tui-icon class="mode-icon" [icon]="m.icon" />
        <span class="mode-label">{{ m.label }}</span>
        <input
          size="s"
          tuiSwitch
          type="checkbox"
          [attr.aria-label]="(isModeExcluded(m.value) ? 'Enable ' : 'Disable ') + m.label"
          [ngModel]="!isModeExcluded(m.value)"
          (ngModelChange)="toggleExclude(m.value)"
          (click)="$event.stopPropagation()"
        />
        <tui-icon icon="@tui.chevron-down" class="chevron" [class.open]="isExpanded(m.value)" />
      </div>

      <tui-expand [expanded]="isExpanded(m.value)">
        <div class="mode-body">
          <div class="filter-group">
            <span class="label">Status</span>
            <div class="chips">
              <button
                size="xs"
                tuiChip
                type="button"
                [appearance]="modeFilters(m.value).status === null ? 'primary' : 'neutral'"
                (click)="setModeFilter(m.value, 'status', null)"
              >
                All
              </button>
              @for (s of statuses; track s) {
                <button
                  size="xs"
                  tuiChip
                  type="button"
                  [appearance]="modeFilters(m.value).status === s.toLowerCase() ? 'primary' : 'neutral'"
                  (click)="setModeFilter(m.value, 'status', s.toLowerCase())"
                >
                  {{ s }}
                </button>
              }
            </div>
          </div>

          <div class="filter-group">
            <span class="label">Length (s)</span>
            <div class="range">
              <tui-textfield tuiTextfieldSize="s">
                <input
                  min="0"
                  placeholder="Min"
                  tuiInput
                  type="number"
                  [value]="msToSec(modeFilters(m.value).minLength)"
                  (change)="setModeMinLength(m.value, $any($event.target).value)"
                />
              </tui-textfield>
              <span>–</span>
              <tui-textfield tuiTextfieldSize="s">
                <input
                  min="0"
                  placeholder="Max"
                  tuiInput
                  type="number"
                  [value]="msToSec(modeFilters(m.value).maxLength)"
                  (change)="setModeMaxLength(m.value, $any($event.target).value)"
                />
              </tui-textfield>
            </div>
          </div>

          @for (f of rangeFields.get(m.value); track f.label) {
            <div class="filter-group">
              <span class="label">{{ f.label }}</span>
              <div class="range">
                <tui-textfield tuiTextfieldSize="s">
                  <input
                    min="0"
                    placeholder="Min"
                    tuiInput
                    type="number"
                    [max]="f.limit"
                    [step]="0.5"
                    [value]="modeFilters(m.value)[f.min] ?? ''"
                    (change)="setModeMin(m.value, f.min, f.max, $any($event.target).value)"
                  />
                </tui-textfield>
                <span>–</span>
                <tui-textfield tuiTextfieldSize="s">
                  <input
                    min="0"
                    placeholder="Max"
                    tuiInput
                    type="number"
                    [max]="f.limit"
                    [step]="0.5"
                    [value]="modeFilters(m.value)[f.max] ?? ''"
                    (change)="setModeMax(m.value, f.min, f.max, $any($event.target).value)"
                  />
                </tui-textfield>
              </div>
            </div>
          }

          @if (m.value === 3) {
            <div class="filter-group">
              <span class="label">{{ m.csLabel }}</span>
              <div class="chips">
                <button
                  size="xs"
                  tuiChip
                  type="button"
                  [appearance]="modeKeyCount(m.value) === null ? 'primary' : 'neutral'"
                  (click)="setModeKeyCount(m.value, null)"
                >
                  All
                </button>
                @for (k of keyCounts; track k) {
                  <button
                    size="xs"
                    tuiChip
                    type="button"
                    [appearance]="modeKeyCount(m.value) === k ? 'primary' : 'neutral'"
                    (click)="setModeKeyCount(m.value, k)"
                  >
                    {{ k }}K
                  </button>
                }
              </div>
            </div>
          }
        </div>
      </tui-expand>
    </section>
  }
  </div>

  <div class="filter-group other">
    <span class="label">Played</span>
    <tui-segmented
      size="s"
      [activeItemIndex]="playedOptions.indexOf(store.filters().lastPlayed)"
      (activeItemIndexChange)="setLastPlayed(playedOptions[$event])"
    >
      <button type="button">All</button>
      <button type="button">Played</button>
      <button type="button">Not played</button>
    </tui-segmented>
  </div>
</div>
