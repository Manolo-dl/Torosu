<div appCard>
  <div tuiTitle>
    <span tuiSubtitle>{{ 'exportSongs.filtered' | transloco }}</span>
    @if (osuDb.isLoading()) {
      <app-skeleton width="4rem" height="1.5rem" />
    } @else {
      <strong>{{ store.totalFiltered() }}</strong>
    }
  </div>
</div>

@if (store.uncheckedFiltered(); as unchecked) {
  <app-unchecked-notice [count]="unchecked" />
}
