<div appearance="floating" tuiCardLarge="compact">
  <h3 tuiTitle>Difficulty</h3>

  <div class="list">
    @for (key of keys; track key) {
      @let stat = trainer[key]();
      <div class="row" [class.locked]="stat.locked">
        <span class="label">{{ key.toUpperCase() }}</span>
        <input
          max="10"
          min="0"
          step="0.1"
          tuiSlider
          type="range"
          [disabled]="stat.locked"
          [ngModel]="stat.value"
          (ngModelChange)="trainer.setValue(key, $event)"
        />
        <span class="value">{{ stat.value | number:'1.1-1' }}</span>
        <button
          size="xs"
          tuiIconButton
          type="button"
          [appearance]="stat.locked ? 'primary' : 'flat'"
          [iconStart]="stat.locked ? '@tui.lock' : '@tui.lock-open'"
          [attr.title]="(stat.locked ? 'Unlock ' : 'Lock ') + key.toUpperCase()"
          (click)="trainer.toggleLock(key)"
        >
          {{ stat.locked ? 'Unlock' : 'Lock' }}
        </button>
      </div>
    }
  </div>
</div>
