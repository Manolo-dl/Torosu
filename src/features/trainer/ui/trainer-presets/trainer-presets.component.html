<div appearance="floating" tuiCardLarge="compact">
  <h3 tuiTitle>
    Presets
    <span tuiSubtitle>Replace the converts with a saved list</span>
  </h3>

  <div class="presets">
    @for (preset of builtIn; track preset.name) {
      <button
        appearance="secondary"
        size="s"
        tuiButton
        type="button"
        [title]="describe(preset)"
        (click)="presets.apply(preset)"
      >
        {{ preset.name }}
      </button>
    }
    @for (preset of presets.custom(); track preset.name) {
      <span class="custom">
        <button
          appearance="secondary"
          size="s"
          tuiButton
          type="button"
          [title]="describe(preset)"
          (click)="presets.apply(preset)"
        >
          {{ preset.name }}
        </button>
        <button
          appearance="flat"
          iconStart="@tui.trash-2"
          size="xs"
          tuiIconButton
          type="button"
          title="Delete this preset"
          (click)="presets.remove(preset.name)"
        >
          Delete preset
        </button>
      </span>
    }
  </div>

  @if (naming()) {
    <div class="save">
      <tui-textfield tuiTextfieldSize="s">
        <label tuiLabel>Preset name</label>
        <input
          tuiInput
          [(ngModel)]="name"
          (keydown.enter)="save()"
        />
      </tui-textfield>
      <button
        size="s"
        tuiButton
        type="button"
        [disabled]="!name().trim()"
        (click)="save()"
      >
        Save
      </button>
      <button
        appearance="flat"
        size="s"
        tuiButton
        type="button"
        (click)="naming.set(false)"
      >
        Cancel
      </button>
    </div>
  } @else {
    <button
      appearance="flat"
      iconStart="@tui.save"
      size="s"
      tuiButton
      type="button"
      [disabled]="!canSave()"
      (click)="naming.set(true)"
    >
      Save current as preset
    </button>
  }
</div>
