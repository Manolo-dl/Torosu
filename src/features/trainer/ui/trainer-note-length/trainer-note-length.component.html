<span class="title">{{ label() | transloco }}</span>

<div class="controls">
  <app-option-group [active]="activeIndex()" [options]="options" (activeChange)="onSegment($event)" />

  @if (value().unit === 'ms') {
    <tui-textfield tuiTextfieldSize="s" [tuiTextfieldCleaner]="false" class="ms">
      <input min="0" step="1" tuiInput type="number" [value]="value().value" (change)="onMsInput($any($event.target).value)" />
    </tui-textfield>
  }
</div>

<span class="hint">
  {{ hint() | transloco }}
  @if (approxMs() !== null) {
    {{ 'trainer.noteLength.approx' | transloco: { divisor: value().value, ms: approxMs(), bpm: bpm() } }}
  }
</span>
