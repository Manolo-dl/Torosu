<div class="buttons">
  <button
    appearance="secondary"
    size="m"
    tuiButton
    type="button"
    [disabled]="trainer.creating()"
    (click)="trainer.reset()"
  >
    {{ 'trainer.actions.reset' | transloco }}
  </button>
  <button
    iconStart="@tui.wand-sparkles"
    size="m"
    tuiButton
    type="button"
    [loading]="trainer.creating()"
    (click)="trainer.createMaps()"
  >
    @if (trainer.converts().length === 1) {
      {{ 'trainer.actions.createMap' | transloco }}
    } @else {
      {{ 'trainer.actions.createMaps' | transloco: { count: trainer.converts().length } }}
    }
  </button>
</div>

@if (trainer.creating()) {
  <div class="progress">
    <progress
      max="100"
      size="m"
      tuiProgressBar
      [value]="trainer.progress()"
    ></progress>
    <span class="percent">{{ trainer.progress() }}%</span>
  </div>
}
