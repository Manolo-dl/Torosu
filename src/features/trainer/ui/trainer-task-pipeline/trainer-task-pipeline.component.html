<div appearance="floating" tuiCardLarge="compact">
  <header>
    <h3 tuiTitle>Tasks</h3>
    <button
      iconStart="@tui.plus"
      size="s"
      tuiButton
      type="button"
      [disabled]="availableTasksFiltered().length === 0"
      [tuiDropdown]="taskMenu"
      [(tuiDropdownOpen)]="menuOpen"
    >
      Add task
    </button>
    <ng-template #taskMenu>
      <tui-data-list>
        @for (type of availableTasksFiltered(); track type) {
          <button tuiOption type="button" (click)="addTask(type)">
            {{ taskLabels[type] }}
          </button>
        }
      </tui-data-list>
    </ng-template>
  </header>

  <div appearance="warning" size="s" tuiNotification>
    Only <strong>Rate Change</strong> is currently implemented. Other tasks are coming soon.
  </div>

  <div class="list" cdkDropList (cdkDropListDropped)="onDrop($event)">
    @for (entry of trainer.tasks(); track entry.id) {
      <div class="task" cdkDrag>
        <tui-icon icon="@tui.grip-vertical" class="handle" cdkDragHandle />

        <div class="content">
          <span class="label">{{ taskLabels[entry.task.type] }}</span>

          @if (entry.task.type === 'RateChange') {
            <div class="params">
              <tui-textfield tuiTextfieldSize="m" [tuiTextfieldCleaner]="false" class="rate">
                <label tuiLabel>Rate</label>
                <input
                  max="2"
                  min="0.5"
                  step="0.05"
                  tuiInput
                  type="number"
                  [value]="entry.task.params.rate"
                  (change)="onRateInput(entry.id, $any($event.target).value, entry.task.params.adjustPitch)"
                />
              </tui-textfield>

              <tui-textfield tuiTextfieldSize="m" [tuiTextfieldCleaner]="false" class="bpm">
                <label tuiLabel>
                  BPM
                  @if (originalBpm() !== null) {
                    ({{ originalBpm() }} →)
                  }
                </label>
                <input
                  min="1"
                  step="1"
                  tuiInput
                  type="number"
                  [value]="newBpm(entry.task.params.rate) ?? entry.task.params.rate * 180"
                  (change)="onBpmInput(entry.id, $any($event.target).value, entry.task.params.adjustPitch)"
                />
              </tui-textfield>

              <label tuiLabel class="pitch">
                <input
                  size="s"
                  tuiCheckbox
                  type="checkbox"
                  [ngModel]="entry.task.params.adjustPitch"
                  (ngModelChange)="onRateInput(entry.id, entry.task.params.rate + '', $event)"
                />
                Adjust pitch
              </label>
            </div>
          }
        </div>

        <button
          appearance="flat"
          iconStart="@tui.trash-2"
          size="s"
          tuiIconButton
          type="button"
          (click)="trainer.removeTask(entry.id)"
        >
          Remove task
        </button>
      </div>
    } @empty {
      <p class="empty">No tasks added yet.</p>
    }
  </div>
</div>
