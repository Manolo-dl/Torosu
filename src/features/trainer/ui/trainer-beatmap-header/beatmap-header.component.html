<div class="banner">
  @if (reader.backgroundUrl(); as url) {
    <img alt="" class="background" [src]="url" />
  }

  <div class="overlay">
    <div tuiTitle="m" class="info">
      <span class="title">
        {{ reader.title() }} <span class="artist">— {{ reader.artist() }}</span>
      </span>
      <span tuiSubtitle>{{ reader.version() }} · {{ 'trainer.mappedBy' | transloco: { mapper: reader.mapper() } }}</span>
    </div>

    <div class="side">
      @let current = mode();
      @if (current !== null) {
        <tui-icon
          class="mode"
          [icon]="modeIcon(current)"
          [style.color]="modeColor(current)"
          [attr.title]="modeName()"
          [attr.aria-label]="modeName()"
        />
      }
      <app-star-badge size="l" class="stars" [stars]="reader.stars()" />
      <app-skill-badges size="l" onImage [skill]="reader.skill()" [display]="skillDisplay()" [keyCount]="reader.keyCount()" />
      @if (reader.data()?.paths) {
        <button
          appearance="floating"
          iconStart="@tui.download"
          size="s"
          tuiIconButton
          type="button"
          [title]="'trainer.exportOsz' | transloco"
          [loading]="reader.exporting()"
          (click)="reader.exportOsz()"
        >
          {{ 'trainer.exportOsz' | transloco }}
        </button>
      }
    </div>
  </div>
</div>
