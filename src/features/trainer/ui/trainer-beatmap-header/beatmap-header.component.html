<div
  class="banner"
  [style.background-image]="tosu.backgroundUrl()"
>
  <div class="overlay">
    <div tuiTitle="m" class="info">
      <span class="title">
        {{ tosu.title() }} <span class="artist">— {{ tosu.artist() }}</span>
      </span>
      <span tuiSubtitle>{{ tosu.version() }} · mapped by {{ tosu.mapper() }}</span>
    </div>

    <span
      size="l"
      tuiBadge
      class="stars"
      [style.background]="starBg(tosu.stars())"
      [style.color]="starFg(tosu.stars())"
    >
      ★ {{ tosu.stars() | number:'1.2-2' }}
    </span>
  </div>
</div>
