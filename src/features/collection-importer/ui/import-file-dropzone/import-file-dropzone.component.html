<div appearance="floating" tuiCardLarge="compact">
  <h3 tuiTitle>
    File
    <span tuiSubtitle>One collection per block, with beatmap hashes or links.</span>
  </h3>
  <label
    appTxtFileDrop
    #dropzone="appTxtFileDrop"
    tuiInputFiles
    [class.drag-over]="dropzone.isDragOver()"
    (fileContent)="onFileContent($event)"
  >
    <input
      accept=".txt"
      tuiInputFiles
      [ngModel]="null"
      (ngModelChange)="onFileSelect($event)"
    />
    <ng-template let-dragged>
      <div class="content">
        <tui-icon icon="@tui.file-text" />
        @if (dragged || dropzone.isDragOver()) {
          <span>Drop the <code>.txt</code> file here</span>
        } @else {
          <span>Drop a <code>.txt</code> file here or <a tuiLink>browse</a></span>
        }
      </div>
    </ng-template>
  </label>
</div>
