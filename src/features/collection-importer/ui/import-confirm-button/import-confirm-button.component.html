<button
  iconStart="@tui.download"
  size="m"
  tuiButton
  type="button"
  [disabled]="store.totalMaps() === 0"
  [loading]="store.isImporting()"
  (click)="onImport()"
>
  Import {{ store.totalMaps() }} maps
</button>
<button
  appearance="secondary"
  size="m"
  tuiButton
  type="button"
  [disabled]="store.isImporting() || store.parsedImports().length === 0"
  (click)="store.clear()"
>
  Clear
</button>
