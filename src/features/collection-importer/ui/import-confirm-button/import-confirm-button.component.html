<button
  iconStart="@tui.download"
  size="m"
  tuiButton
  type="button"
  [disabled]="store.totalMaps() === 0"
  [loading]="store.isImporting()"
  (click)="onImport()"
>
  {{ 'collections.import.importMaps' | transloco: { count: store.totalMaps() } }}
</button>
<button
  appearance="secondary"
  size="m"
  tuiButton
  type="button"
  [disabled]="store.isImporting() || store.parsedImports().length === 0"
  (click)="store.clear()"
>
  {{ 'collections.import.clear' | transloco }}
</button>
