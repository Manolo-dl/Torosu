<div appearance="floating" tuiCardLarge="compact">
  <h3 tuiTitle>Preview</h3>

  @if (store.previewGroups().length === 0) {
    <p class="empty">Upload a .txt file to preview collections to import</p>
  } @else {
    <tui-scrollbar class="groups">
      <tui-accordion size="s">
        @for (group of store.previewGroups(); track group.name; let first = $first) {
          <button type="button" [tuiAccordion]="first">
            <span class="group-header">
              <span class="name">{{ group.name }}</span>
              <span
                size="s"
                tuiBadge
                [appearance]="group.isExisting ? 'warning' : 'positive'"
              >
                {{ group.isExisting ? 'Will merge' : 'New' }}
              </span>
              <span appearance="neutral" size="s" tuiBadge>{{ group.sets.length }} sets</span>
            </span>
          </button>
          <tui-expand>
            <div class="sets">
              @for (set of group.sets; track set.folderName) {
                <app-beatmap-set-card [set]="set" />
              } @empty {
                <p class="empty">No installed beatmaps found</p>
              }
            </div>
          </tui-expand>
        }
      </tui-accordion>
    </tui-scrollbar>
  }
</div>
