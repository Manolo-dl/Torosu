<div appearance="floating" tuiCardLarge="compact">
  <h3 tuiTitle>{{ 'packs.details.title' | transloco }}</h3>
  <app-stateful-input
    [formField]="detailsForm.title"
    label="packs.details.packTitle"
    placeholder="packs.details.packTitlePlaceholder"
  />
  <app-stateful-input
    [formField]="detailsForm.finalCreator"
    label="packs.details.creator"
    placeholder="packs.details.creatorPlaceholder"
  />
</div>
