<tui-textfield [invalid]="!!error()">
  <input
    [placeholder]="'packs.diffName' | transloco"
    tuiInput
    [formField]="nameForm.newDiffName"
  />
</tui-textfield>
@if (error(); as message) {
  <app-icon
    name="@tui.circle-alert"
    class="error"
    [tuiHint]="message | transloco"
  />
}
<button
  appButton="ghost"
  iconOnly
  icon="@tui.trash-2"
  size="s"
  type="button"
  (click)="onRemove()"
>
  {{ 'packs.remove' | transloco }}
</button>
