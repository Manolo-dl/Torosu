<tui-textfield [invalid]="!!error()">
  <input
    [placeholder]="'packs.diffName' | transloco"
    tuiInput
    [formField]="nameForm.newDiffName"
  />
</tui-textfield>
@if (error(); as message) {
  <tui-icon
    icon="@tui.circle-alert"
    class="error"
    [tuiHint]="message | transloco"
  />
}
<button
  appearance="flat"
  iconStart="@tui.trash-2"
  size="s"
  tuiIconButton
  type="button"
  (click)="onRemove()"
>
  {{ 'packs.remove' | transloco }}
</button>
