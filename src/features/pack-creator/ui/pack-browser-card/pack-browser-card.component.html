<div class="card" [attr.data-status]="set().status" (click)="toggleExpand($event)">
  <div class="body">
    <div class="head">
      <div class="titles">
        <span class="title">{{ set().title }}</span>
        <span class="artist">{{ set().artist }}</span>
      </div>
      <span size="s" tuiBadge class="status">{{ set().status }}</span>
      <tui-icon icon="@tui.chevron-down" class="chevron" [class.open]="expanded()" />
    </div>

    <tui-expand [expanded]="expanded()">
      <div class="diffs">
        @for (diff of set().diffs; track diff.md5) {
          <div class="diff">
            <span
              size="s"
              tuiBadge
              class="stars"
              [style.background]="starBg(diff.stars)"
              [style.color]="starFg(diff.stars)"
            >
              ★ {{ diff.stars | number:'1.2-2' }}
            </span>
            <span class="name">{{ diff.diffName }}</span>
            @if (store.addedMd5s().has(diff.md5)) {
              <tui-icon icon="@tui.check" class="added" />
            } @else {
              <button
                appearance="secondary"
                iconStart="@tui.plus"
                size="xs"
                tuiIconButton
                type="button"
                (click)="addDiff(diff, $event)"
              >
                Add
              </button>
            }
          </div>
        }
      </div>
    </tui-expand>
  </div>
</div>
