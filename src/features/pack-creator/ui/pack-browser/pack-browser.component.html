<div appearance="floating" tuiCardLarge="compact">
  <header>
    <h3 tuiTitle>Browse Maps</h3>
    <span appearance="neutral" tuiBadge>{{ store.filteredSets().length }} sets</span>
  </header>

  @if (store.filteredSets().length === 0) {
    <p class="empty">No maps found</p>
  } @else {
    <cdk-virtual-scroll-viewport
      itemSize="64"
      tuiScrollRef
      class="viewport"
    >
      <tui-scroll-controls />
      <div *cdkVirtualFor="let set of store.filteredSets(); trackBy: trackSet" class="item">
        <app-pack-browser-card [set]="set" />
      </div>
    </cdk-virtual-scroll-viewport>
  }
</div>
