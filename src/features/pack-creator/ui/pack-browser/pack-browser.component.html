<div appearance="floating" tuiCardLarge="compact">
  <header>
    <h3 tuiTitle>Browse Maps</h3>
    <span appearance="neutral" tuiBadge>{{ store.filteredSets().length }} sets</span>
  </header>

  <app-beatmap-set-list
    emptyText="No maps found"
    listHeight="max(20rem, calc(100vh - 30rem))"
    [sets]="store.filteredSets()"
    [diffAction]="addButton"
  />
</div>

<ng-template #addButton let-diff let-set="set">
  @if (store.addedMd5s().has(diff.md5)) {
    <tui-icon icon="@tui.check" class="added" />
  } @else {
    <button
      appearance="secondary"
      iconStart="@tui.plus"
      size="xs"
      tuiIconButton
      type="button"
      (click)="addDiff(set, diff, $event)"
    >
      Add
    </button>
  }
</ng-template>
