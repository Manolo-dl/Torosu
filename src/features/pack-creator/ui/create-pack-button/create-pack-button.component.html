<div class="actions-row">
  <button
    class="reset-btn"
    [disabled]="store.isCreating()"
    (click)="store.clear()"
  >
    Reset
  </button>

  <button
    class="create-pack-btn"
    [disabled]="store.isCreating() || store.selectedDiffs().length === 0 || !store.titleValid()
    || !store.finalCreator() || store.duplicateNames().size > 0
    || store.hasEmptyNames()"
    (click)="onCreate()"
  >
    @if (store.isCreating()) {
      Creating...
    } @else {
      Create Pack ({{ store.selectedDiffs().length }} diffs)
    }
  </button>
</div>
