<button
  appearance="secondary"
  size="m"
  tuiButton
  type="button"
  [disabled]="store.isCreating()"
  (click)="store.clear()"
>
  {{ 'packs.reset' | transloco }}
</button>
<button
  iconStart="@tui.package"
  size="m"
  tuiButton
  type="button"
  [disabled]="store.selectedDiffs().length === 0 || !store.titleValid()
    || !store.finalCreator() || store.duplicateNames().size > 0
    || store.hasEmptyNames()"
  [loading]="store.isCreating()"
  (click)="onCreate()"
>
  @if (store.packCount() > 1) {
    {{ 'packs.createMany' | transloco: { packs: store.packCount(), sets: store.setCount(), diffs: store.selectedDiffs().length } }}
  } @else {
    {{ 'packs.createOne' | transloco: { diffs: store.selectedDiffs().length } }}
  }
</button>
