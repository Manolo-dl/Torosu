<button
  appearance="secondary"
  size="m"
  tuiButton
  type="button"
  [disabled]="store.isCreating()"
  (click)="store.clear()"
>
  Reset
</button>
<button
  iconStart="@tui.package"
  size="m"
  tuiButton
  type="button"
  [disabled]="store.selectedDiffs().length === 0 || !store.titleValid()
    || !store.finalCreator() || store.duplicateNames().size > 0
    || store.hasEmptyNames()"
  [loading]="store.isCreating()"
  (click)="onCreate()"
>
  Create pack ({{ store.selectedDiffs().length }} diffs)
</button>
