<div appearance="floating" tuiCardLarge="compact">
  <header>
    <h3 tuiTitle>{{ 'packs.preview' | transloco }}</h3>
    <span appearance="info" tuiBadge>{{ 'packs.diffs' | transloco: { count: store.selectedDiffs().length } }}</span>
  </header>

  @if (store.selectedDiffs().length === 0) {
    <p class="empty">{{ 'packs.empty' | transloco }}</p>
  } @else {
    <!-- itemSize must match the fixed height of app-pack-preview-card -->
    <cdk-virtual-scroll-viewport
      itemSize="36"
      tuiScrollRef
      class="viewport"
    >
      <tui-scroll-controls />
      <app-pack-preview-card
        *cdkVirtualFor="let diff of store.selectedDiffs(); trackBy: trackDiff"
        [diff]="diff"
      />
    </cdk-virtual-scroll-viewport>
  }
</div>
