<div appearance="floating" tuiCardLarge="compact">
  <header>
    <h3 tuiTitle>Pack Preview</h3>
    <span appearance="info" tuiBadge>{{ store.selectedDiffs().length }} diffs</span>
  </header>

  @if (store.selectedDiffs().length === 0) {
    <p class="empty">Add diffs from the browser to build your pack</p>
  } @else {
    <!-- itemSize must match the fixed height of app-pack-preview-card -->
    <cdk-virtual-scroll-viewport
      itemSize="36"
      tuiScrollRef
      class="viewport"
    >
      <tui-scroll-controls />
      <app-pack-preview-card
        *cdkVirtualFor="let diff of store.selectedDiffs(); trackBy: trackDiff"
        [diff]="diff"
      />
    </cdk-virtual-scroll-viewport>
  }
</div>
