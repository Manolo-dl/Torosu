<div appearance="floating" tuiCardLarge="compact">
  <h3 tuiTitle>{{ 'collections.export.summary' | transloco }}</h3>
  <div class="metrics">
    <div tuiTitle>
      <span tuiSubtitle>{{ 'collections.export.selected' | transloco }}</span>
      <strong>{{ store.selectedCount() }}</strong>
    </div>
    <div tuiTitle>
      <span tuiSubtitle>{{ 'collections.export.totalSets' | transloco }}</span>
      <strong>{{ store.totalSelectedSets() }}</strong>
    </div>
  </div>
</div>

@if (store.uncheckedSelectedSets(); as unchecked) {
  <app-unchecked-notice [count]="unchecked" />
}
