<div appearance="floating" tuiCardLarge="compact">
  <header>
    <h3 tuiTitle>Collections</h3>
    <label tuiLabel>
      <input
        size="s"
        tuiCheckbox
        type="checkbox"
        [disabled]="store.collectionsWithBeatmaps().length === 0"
        [ngModel]="store.allSelected()"
        (ngModelChange)="$event ? store.selectAll() : store.clearSelection()"
      />
      Select all
    </label>
  </header>

  @if (store.isLoading()) {
    <tui-loader size="m" class="state" />
  } @else if (!store.isLoaded()) {
    <p class="state">Open a collection to get started</p>
  } @else if (store.collectionsWithBeatmaps().length === 0) {
    <p class="state">No collections found</p>
  } @else {
    <tui-scrollbar class="list">
      @for (col of store.collectionsWithBeatmaps(); track col.name) {
        <label
          tuiCell="s"
          [class.selected]="store.selectedCollections().includes(col.name)"
        >
          <input
            size="s"
            tuiCheckbox
            type="checkbox"
            [ngModel]="store.selectedCollections().includes(col.name)"
            (ngModelChange)="store.toggleSelection(col.name)"
          />
          <span class="name">{{ col.name }}</span>
          <span appearance="neutral" size="s" tuiBadge>{{ col.sets.length }}</span>
        </label>
      }
    </tui-scrollbar>
  }
</div>
