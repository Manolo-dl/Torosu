<div appearance="floating" tuiCardLarge="compact">
  <header>
    <h3 tuiTitle>Preview</h3>
    @if (store.selectedCount() > 0) {
      <span appearance="info" tuiBadge>{{ store.totalSelectedSets() }} sets</span>
    }
  </header>
  <app-beatmap-set-list
    [sets]="store.selectedSets()"
    emptyText="Select a collection to preview"
    listHeight="calc(100vh - 23rem)"
  />
</div>
