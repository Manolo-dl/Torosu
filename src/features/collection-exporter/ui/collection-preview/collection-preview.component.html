@if (store.text()) {
  <div class="text">
    <pre>{{ preview() }}</pre>
    @if (more() > 0) {
      <span class="more">{{ 'collections.export.moreLines' | transloco: { count: more() } }}</span>
    }
  </div>

  <div class="actions">
    <button appButton="primary" icon="save" type="button" (click)="store.save()">
      {{ 'collections.export.save' | transloco }}
    </button>
    <button appButton="secondary" icon="copy" type="button" (click)="store.copy()">
      {{ 'collections.export.copy' | transloco }}
    </button>
  </div>
} @else {
  <p class="nothing">{{ 'collections.export.nothing' | transloco }}</p>
}
