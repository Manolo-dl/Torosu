<div appearance="floating" tuiCardLarge="compact">
  <h3 tuiTitle>Tables</h3>

  <div class="list">
    @for (table of store.tables(); track table.name) {
      <button
        tuiCell="s"
        type="button"
        [class.active]="store.selectedTable() === table.name"
        (click)="store.selectTable(table.name)"
      >
        <tui-icon icon="@tui.table" />
        <span class="name">{{ table.name }}</span>
        <span appearance="neutral" size="s" tuiBadge>{{ table.columns.length }}</span>
      </button>
    } @empty {
      <p class="empty">No tables found</p>
    }
  </div>
</div>
