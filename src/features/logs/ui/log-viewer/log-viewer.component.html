<div class="toolbar">
  <span appBadge tone="neutral">{{ 'dev.logs.entries' | transloco: { count: store.totalLogs() } }}</span>
  <button
    appButton="secondary"
    icon="@tui.refresh-cw"
    size="s"
    type="button"
    [loading]="reloading()"
    (click)="reload()"
  >
    Reload
  </button>
</div>

@for (level of levels; track level) {
  <app-log-column
    [level]="level"
    [groups]="store.groupedLogs()[level]"
  />
}
