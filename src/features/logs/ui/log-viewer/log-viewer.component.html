<div class="toolbar">
  <span appearance="neutral" tuiBadge>{{ store.totalLogs() }} entries</span>
  <button
    appearance="secondary"
    iconStart="@tui.refresh-cw"
    size="s"
    tuiButton
    type="button"
    [loading]="reloading()"
    (click)="reload()"
  >
    Reload
  </button>
</div>

@for (level of levels; track level) {
  <app-log-column
    [level]="level"
    [groups]="store.groupedLogs()[level]"
  />
}
