<div
  appearance="floating"
  tuiCardLarge="compact"
  [attr.data-level]="level().toLowerCase()"
>
  <header>
    <span size="m" tuiBadge [appearance]="appearance()">{{ level() }}</span>
    <span appearance="neutral" size="s" tuiBadge>{{ totalCount() }}</span>
  </header>

  @if (targetNames().length === 0) {
    <p class="empty">No entries</p>
  } @else {
    <tui-accordion size="s" [closeOthers]="false">
      @for (target of targetNames(); track target) {
        <button type="button" [tuiAccordion]="false">
          <span class="target">
            <span class="name">{{ target }}</span>
            <span appearance="neutral" size="s" tuiBadge>{{ entriesFor(target).length }}</span>
          </span>
        </button>
        <tui-expand>
          <tui-scrollbar *tuiItem class="entries">
            @for (entry of entriesFor(target); track $index) {
              <div class="entry">
                <span class="timestamp">{{ entry.timestamp }}</span>
                <span class="message">{{ entry.message }}</span>
              </div>
            }
          </tui-scrollbar>
        </tui-expand>
      }
    </tui-accordion>
  }
</div>
