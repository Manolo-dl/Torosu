[package]
name = "torosu"
version = "1.2.0"
description = "osu! stable tools in one app: beatmap downloader, collections, packs and a map trainer"
license = "MIT"
authors = ["Manolo-dl"]
repository = "https://github.com/Manolo-dl/Torosu"
homepage = "https://github.com/Manolo-dl/Torosu"
readme = "../README.md"
keywords = ["osu", "osu-mania", "beatmap", "tauri"]
categories = ["games"]
edition = "2021"
publish = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "torosu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls"] }
tauri-plugin-log = "2.10.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-os = "2.4.0"
serde = { version = "1", features = ["derive"] }
# Also needed outside the tests: `tauri::generate_context!` expands to code that uses it.
serde_json = "1"
toml = "1.1.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
osynic_osudb = "0.1.5"
anyhow = "1.0.104"
thiserror = "2"
rosu-map = "0.2.1"
# Built from source and linked in: otherwise, on Linux, it links to the system
# libSoundTouch, which the CI runner and most users don't have.
soundtouch = { version = "0.5.4", features = ["bundled"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm", "id3v2"] }
log = "0.4.34"
tokio = { version = "1.54.0", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
zip = { version = "9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
futures-util = { version = "0.3.34", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
vorbis_rs = "0.5.6"
osu-memory-reader = { version = "0.2.1", features = ["serde", "difficulty"] }
# Mania Tracker's dan calculator. Not on crates.io: pinned to a commit.
# `aot`: MinaCalc's wasm is compiled when Torosu is built, so there is no
# compiler (cranelift) in the binary and no wait on the first map rated.
dan-calc = { git = "https://github.com/aleju03/mania-hub", rev = "0d4353b5037b4f8d85763751bea9e0f41f586c58", default-features = false, features = ["aot"] }


[dev-dependencies]
# The mock app of tauri::test, for the reader's tests.
tauri = { version = "2", default-features = false, features = ["test"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Not `panic = "abort"`, which the guideline suggests: a library can panic on a
# broken osu!.db, audio or video file, and the app catches that (`catch_unwind`,
# `spawn_blocking`) to report an error instead of closing. Both need unwinding.
strip = true

# Keep the audio decoding/encoding hot paths fast despite opt-level = "s"
[profile.release.package.symphonia-core]
opt-level = 3

[profile.release.package.symphonia-bundle-mp3]
opt-level = 3

[profile.release.package.symphonia-codec-vorbis]
opt-level = 3

[profile.release.package.aotuv_lancer_vorbis_sys]
opt-level = 3

# Same hot paths in `tauri dev`: at opt-level 0 the libvorbis C code and the
# symphonia decoders are 5-15x slower than in release.
[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3

[profile.dev.package.aotuv_lancer_vorbis_sys]
opt-level = 3

[profile.dev.package.ogg_next_sys]
opt-level = 3

[profile.dev.package.soundtouch-ffi]
opt-level = 3

# The dan estimate (dan-calc) runs on every mania beatmap selected in osu!,
# and on every convert previewed in the trainer.
[profile.release.package.chart-pipeline]
opt-level = 3

[profile.release.package.leoblack-estimators]
opt-level = 3

[profile.release.package.leoblack-rework]
opt-level = 3

[profile.release.package.leoblack-patterns]
opt-level = 3

[profile.release.package.leoblack-ett]
opt-level = 3

[profile.release.package.dan-core]
opt-level = 3

[profile.release.package.prism]
opt-level = 3

[profile.release.package.ln-skill]
opt-level = 3

[profile.release.package.jsmath]
opt-level = 3

# Build scripts and their dependencies are built unoptimized by default.
# dan-calc's `aot` build script compiles MinaCalc's wasm with cranelift: built
# that way, cranelift needs more than the 1 MB of stack of the main thread on
# Windows (a stack overflow in the Windows release) and takes ~10 s; optimized,
# it fits in 256 KB, takes 0.7 s, and its output is the same.
[profile.release.build-override]
opt-level = 3

[profile.dev.package.chart-pipeline]
opt-level = 3

[profile.dev.package.leoblack-estimators]
opt-level = 3

[profile.dev.package.leoblack-rework]
opt-level = 3

[profile.dev.package.leoblack-patterns]
opt-level = 3

[profile.dev.package.leoblack-ett]
opt-level = 3

[profile.dev.package.dan-core]
opt-level = 3

[profile.dev.package.prism]
opt-level = 3

[profile.dev.package.ln-skill]
opt-level = 3

[profile.dev.package.jsmath]
opt-level = 3

# osu-memory-reader finds the game's memory signatures when it attaches,
# with memchr: 2.8 s at opt-level 0, 0.05 s at 3, before the trainer can
# show the map in `tauri dev`. rosu-pp and rosu-map read the .osu files.
[profile.dev.package.osu-memory-reader]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[profile.dev.package.rosu-pp]
opt-level = 3

[profile.dev.package.rosu-map]
opt-level = 3

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
