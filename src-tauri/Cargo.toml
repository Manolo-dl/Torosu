[package]
name = "torosu"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "torosu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2.5.0"
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls"] }
tauri-plugin-log = "2.10.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-os = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio", "derive"] }
toml = "1.1.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
osynic_osudb = "0.1.5"
anyhow = "1.0.104"
rosu-map = "0.2.1"
soundtouch = "0.5.4"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm", "id3v2"] }
log = "0.4.34"
tokio = { version = "1.54.0", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
zip = { version = "8.6.0", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
vorbis_rs = "0.5.6"
osu-memory-reader = "0.1.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Keep the audio decoding/encoding hot paths fast despite opt-level = "s"
[profile.release.package.symphonia-core]
opt-level = 3

[profile.release.package.symphonia-bundle-mp3]
opt-level = 3

[profile.release.package.symphonia-codec-vorbis]
opt-level = 3

[profile.release.package.aotuv_lancer_vorbis_sys]
opt-level = 3

# Same hot paths in `tauri dev`: at opt-level 0 the libvorbis C code and the
# symphonia decoders are 5-15x slower than in release.
[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3

[profile.dev.package.aotuv_lancer_vorbis_sys]
opt-level = 3

[profile.dev.package.ogg_next_sys]
opt-level = 3

[profile.dev.package.soundtouch-ffi]
opt-level = 3
