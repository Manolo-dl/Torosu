name: Release

# Pushing a tag like v1.0.0 builds Torosu for Windows and Linux and creates a
# draft release with the installers and the updater's latest.json, signed.
# Review it on GitHub, write the notes, and publish it.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # An older Ubuntu, so the AppImage runs on more distributions (glibc).
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Where the AppImage's updates are, for AppImageUpdate and the like:
          # linuxdeploy embeds it and writes the .zsync next to the AppImage.
          LDAI_UPDATE_INFORMATION: gh-releases-zsync|Manolo-dl|Torosu|latest|torosu_*_amd64.AppImage.zsync
          # Windows: soundtouch-ffi makes its bindings with bindgen, whose
          # libclang only reads the headers (MSVC builds SoundTouch). Visual
          # Studio 18's standard library refuses a Clang older than 22 there
          # (STL1000), and the runner's is older: its own switch lets it be.
          BINDGEN_EXTRA_CLANG_ARGS: ${{ matrix.platform == 'windows-latest' && '-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Torosu ${{ github.ref_name }}
          releaseBody: |
            ## Downloads
            - **Windows**: `torosu_<version>_x64-setup.exe`
            - **Ubuntu / Debian**: `.deb`
            - **Fedora**: `.rpm`
            - **Arch Linux and any other**: the install script, see the [README](https://github.com/Manolo-dl/Torosu#linux), or the `.AppImage`

            Torosu updates itself from the app.
          releaseDraft: true
          prerelease: false

      # tauri-action uploads only the files it knows: the .zsync goes up here,
      # to the same draft release (by id: a draft can't be found by its tag).
      - name: Upload the AppImage's zsync
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          # linuxdeploy writes it where it runs (src-tauri), not next to the AppImage.
          files=(src-tauri/*.AppImage.zsync src-tauri/target/release/bundle/appimage/*.AppImage.zsync)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .zsync next to the AppImage: was LDAI_UPDATE_INFORMATION passed to linuxdeploy?"
            exit 1
          fi
          for file in "${files[@]}"; do
            gh api --method POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=$(basename "$file")" \
              --input "$file" > /dev/null
          done
