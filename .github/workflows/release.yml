name: Release

# Pushing a tag like v1.0.0 builds Torosu for Windows and Linux and creates a
# draft release with the installers and the updater's latest.json, signed.
# Review it on GitHub, write the notes, and publish it.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # An older Ubuntu, so the AppImage runs on more distributions (glibc).
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Torosu ${{ github.ref_name }}
          releaseBody: |
            ## Downloads
            - **Windows**: `torosu_<version>_x64-setup.exe`
            - **Ubuntu / Debian**: `.deb`
            - **Fedora**: `.rpm`
            - **Arch Linux and any other**: the install script, see the [README](https://github.com/Manolo-dl/Torosu#linux), or the `.AppImage`

            Torosu updates itself from the app.
          releaseDraft: true
          prerelease: false
